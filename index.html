<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Focus Forest</title>
  <style>
    :root {
      --bg: #0a0c0f;
      --text: #e2e8f0;
      --dim: #475569;
      --green: #22c55e;
      --pink: #f472b6;
      --amber: #fbbf24;
      --cyan: #38bdf8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, Menlo, Monaco, monospace; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 16px 20px;
      user-select: none;
      -webkit-user-select: none;
    }
    .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
    .nav-tabs { display: flex; gap: 12px; margin: 10px 0; }
    .tab-btn { background: none; border: none; color: var(--dim); font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 8px; }
    .tab-btn.active { color: var(--green); border-bottom: 2px solid var(--green); }
    
    .view-panel { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
    .hidden { display: none !important; }

    /* Grow View */
    .tier-select { display: flex; gap: 6px; width: 100%; justify-content: center; margin-bottom: 12px; }
    .tier-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
    }
    .tier-btn.selected { background: var(--green); color: #000; font-weight: bold; border-color: var(--green); }
    
    .stage-box {
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #1e293b;
      margin-bottom: 12px;
      overflow: hidden;
    }
    pre { font-size: 11px; line-height: 1.15; text-align: center; white-space: pre; }
    
    .timer { font-size: 40px; font-weight: 700; letter-spacing: 2px; color: #fff; margin-bottom: 4px; }
    .bar { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .status { font-size: 12px; color: var(--dim); min-height: 16px; margin-bottom: 16px; }

    .main-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-start { background: var(--green); color: #000; }
    .btn-giveup { background: transparent; color: var(--red); border: 1px solid var(--red); }

    /* Forest Garden Grid View */
    .garden-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-height: 380px;
      overflow-y: auto;
      padding: 8px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .plot {
      background: #1e293b;
      height: 80px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      border: 1px dashed #334155;
    }
    .plot.occupied { border: 1px solid #475569; }
    .plot pre { font-size: 8px; line-height: 1; }

    /* Colors per tier */
    .c-10 { color: var(--green); }
    .c-25 { color: var(--cyan); }
    .c-45 { color: var(--pink); }
    .c-60 { color: var(--amber); }
    .c-120 { color: #c084fc; text-shadow: 0 0 8px rgba(192,132,252,0.4); }
    .c-dead { color: var(--red); }
  </style>
</head>
<body>

  <div class="header">
    <span id="statTime">TOTAL FOCUS: 0m</span>
    <span id="statCount">PLANTED: 0</span>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tabPlant" onclick="switchTab('plant')">PLANT</button>
    <button class="tab-btn" id="tabForest" onclick="switchTab('forest')">MY FOREST</button>
  </div>

  <!-- PLANTING VIEW -->
  <div class="view-panel" id="viewPlant">
    <div class="tier-select" id="tierGroup">
      <button class="tier-btn" onclick="selectTier(10)">10M</button>
      <button class="tier-btn selected" onclick="selectTier(25)">25M</button>
      <button class="tier-btn" onclick="selectTier(45)">45M</button>
      <button class="tier-btn" onclick="selectTier(60)">60M</button>
      <button class="tier-btn" onclick="selectTier(120)">120M</button>
    </div>

    <div class="stage-box">
      <pre id="displayArt" class="c-25">Select a tier & plant</pre>
    </div>

    <div class="timer" id="timer">25:00</div>
    <div class="bar" id="progressBar">[....................]</div>
    <div class="status" id="status">READY</div>

    <button class="main-btn btn-start" id="actionBtn" onclick="toggleSession()">PLANT TREE</button>
  </div>

  <!-- FOREST COLLECTION VIEW -->
  <div class="view-panel hidden" id="viewForest">
    <div class="garden-grid" id="gardenGrid"></div>
  </div>

  <script>
    // --- ASCII ASSET TIERS ---
    const TREES = {
      10: {
        name: "Sprout Shrub",
        color: "c-10",
        growth: [
          "   .   \n       ",
          "  (.)  \n   |   ",
          " (\\|/) \n   |   ",
          " .oOOo.\n(O@@@O)\n  |||  "
        ],
        mini: " oOo \n(@O@)\n || "
      },
      25: {
        name: "Evergreen Pine",
        color: "c-25",
        growth: [
          "   ^   \n       ",
          "  / \\  \n /   \\ \n   |   ",
          "  /X\\  \n /XXX\\ \n/XXXXX\\\n  |||  ",
          "   ▲   \n  /█\\  \n /███\\ \n/█████\\\n  |||  "
        ],
        mini: "  ▲  \n /█\\ \n/███\\\n  |  "
      },
      45: {
        name: "Sakura Blossom",
        color: "c-45",
        growth: [
          "   *   \n       ",
          "  *#*  \n   |   ",
          " *✿*✿* \n✿*✿*✿*✿\n  /|\\  \n   |   ",
          "  .✿*✿. \n ✿*✿*✿*✿ \n*✿*✿*✿*✿*\n  \\_|_/  \n    |    "
        ],
        mini: " ✿*✿ \n✿*✿*✿\n  |  "
      },
      60: {
        name: "Grand Celtic Oak",
        color: "c-60",
        growth: [
          "   o   \n       ",
          "  /|\\  \n ( | ) \n   |   ",
          "  .---.  \n ( @@@ ) \n(@@@@@@@)\n  \\_|_/  \n   / \\   ",
          "   .▓▓▓▓▓.   \n ▓▓▓▓▓▓▓▓▓▓▓ \n▓▓▓▓▓▓▓▓▓▓▓▓▓\n ▓▓▓▓▓▓▓▓▓▓▓ \n    \\_|_/    \n     / \\     \n    /   \\    "
        ],
        mini: " ▓▓▓ \n▓▓▓▓▓\n \\|/ "
      },
      120: {
        name: "Yggdrasil (World Tree)",
        color: "c-120",
        growth: [
          "   ✦   \n       ",
          "  /✦\\  \n ( ✦ ) \n   |   ",
          "  .✦★✦.  \n ✦★✦★✦★✦ \n  \\_|_/  \n   / \\   ",
          "    .·:★:·.    \n  .·:*:✦:*:·.  \n :*:✦:★:✦:*: \n  '·:*:✦:*:·'  \n     \\_|_/     \n     / | \\     \n   _/__|__\\_   \n  /  / | \\  \\  "
        ],
        mini: "·:★:·\n✦:★:✦\n \\|/ \n/_|_\\"
      }
    };

    const WITHERED_ART = "   \\ /   \n  --X--  \n   / \\   \n    x    ";

    // --- STATE MANAGEMENT ---
    let selectedDuration = 25 * 60;
    let selectedMinutes = 25;
    let timeLeft = selectedDuration;
    let timerId = null;
    let isRunning = false;
    let wakeLock = null;

    let forestData = JSON.parse(localStorage.getItem("focus_forest_save") || "[]");

    // Elements
    const displayArt = document.getElementById("displayArt");
    const timerDisplay = document.getElementById("timer");
    const progressBar = document.getElementById("progressBar");
    const statusText = document.getElementById("status");
    const actionBtn = document.getElementById("actionBtn");
    const gardenGrid = document.getElementById("gardenGrid");
    const statTime = document.getElementById("statTime");
    const statCount = document.getElementById("statCount");

    function saveForest() {
      localStorage.setItem("focus_forest_save", JSON.stringify(forestData));
      updateStats();
    }

    function updateStats() {
      const totalMinutes = forestData.reduce((acc, curr) => acc + (curr.dead ? 0 : curr.minutes), 0);
      statTime.textContent = `TOTAL FOCUS: ${totalMinutes}m`;
      statCount.textContent = `PLANTED: ${forestData.filter(t => !t.dead).length}`;
    }

    function selectTier(mins) {
      if (isRunning) return;
      selectedMinutes = mins;
      selectedDuration = mins * 60;
      timeLeft = selectedDuration;

      document.querySelectorAll(".tier-btn").forEach(btn => {
        btn.classList.toggle("selected", btn.textContent === `${mins}M`);
      });

      renderFrame(selectedDuration);
      statusText.textContent = `TARGET: ${TREES[mins].name}`;
    }

    function renderFrame(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;

      const pct = (selectedDuration - sec) / selectedDuration;
      const filled = Math.round(pct * 20);
      progressBar.textContent = `[${'#'.repeat(filled)}${'.'.repeat(20 - filled)}]`;

      const tree = TREES[selectedMinutes];
      displayArt.className = tree.color;

      if (pct < 0.25) displayArt.textContent = tree.growth[0];
      else if (pct < 0.60) displayArt.textContent = tree.growth[1];
      else if (pct < 0.90) displayArt.textContent = tree.growth[2];
      else displayArt.textContent = tree.growth[3];
    }

    async function lockScreen() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function unlockScreen() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function toggleSession() {
      if (isRunning) fail();
      else start();
    }

    function start() {
      isRunning = true;
      timeLeft = selectedDuration;
      statusText.textContent = "GROWING... LEAVING APP DIES";
      actionBtn.className = "main-btn btn-giveup";
      actionBtn.textContent = "GIVE UP";
      document.getElementById("tierGroup").style.pointerEvents = "none";
      
      renderFrame(timeLeft);
      lockScreen();

      timerId = setInterval(() => {
        timeLeft--;
        renderFrame(timeLeft);
        if (timeLeft <= 0) complete();
      }, 1000);
    }

    function fail() {
      if (!isRunning) return;
      clearInterval(timerId);
      isRunning = false;
      unlockScreen();

      displayArt.className = "c-dead";
      displayArt.textContent = WITHERED_ART;
      statusText.textContent = "WITHERED (LEFT APP / GAVE UP)";
      actionBtn.className = "main-btn btn-start";
      actionBtn.textContent = "PLANT AGAIN";
      document.getElementById("tierGroup").style.pointerEvents = "auto";

      forestData.push({ minutes: selectedMinutes, dead: true, date: Date.now() });
      saveForest();
    }

    function complete() {
      clearInterval(timerId);
      isRunning = false;
      unlockScreen();

      const tree = TREES[selectedMinutes];
      displayArt.className = tree.color;
      displayArt.textContent = tree.growth[3];
      statusText.textContent = `HARVESTED: ${tree.name}!`;
      actionBtn.className = "main-btn btn-start";
      actionBtn.textContent = "PLANT ANOTHER";
      document.getElementById("tierGroup").style.pointerEvents = "auto";

      forestData.push({ minutes: selectedMinutes, dead: false, date: Date.now() });
      saveForest();
    }

    // App Switcher & Notification Center Fail-safes
    document.addEventListener("visibilitychange", () => { if (document.hidden && isRunning) fail(); });
    window.addEventListener("blur", () => { if (isRunning) fail(); });

    // --- TAB SWITCHING & GARDEN RENDER ---
    function switchTab(tab) {
      document.getElementById("tabPlant").classList.toggle("active", tab === 'plant');
      document.getElementById("tabForest").classList.toggle("active", tab === 'forest');
      document.getElementById("viewPlant").classList.toggle("hidden", tab !== 'plant');
      document.getElementById("viewForest").classList.toggle("hidden", tab !== 'forest');

      if (tab === 'forest') renderGarden();
    }

    function renderGarden() {
      gardenGrid.innerHTML = "";
      // Render latest 20 plots
      const recent = [...forestData].reverse().slice(0, 24);
      
      if (recent.length === 0) {
        gardenGrid.innerHTML = `<div style="grid-column: span 4; text-align:center; padding: 40px 0; color: #475569; font-size:12px;">NO TREES YET. PLANT ONE!</div>`;
        return;
      }

      recent.forEach(item => {
        const plot = document.createElement("div");
        plot.className = "plot occupied";
        
        if (item.dead) {
          plot.innerHTML = `<pre class="c-dead">${WITHERED_ART}</pre><span>0m</span>`;
        } else {
          const t = TREES[item.minutes];
          plot.innerHTML = `<pre class="${t.color}">${t.mini}</pre><span>${item.minutes}m</span>`;
        }
        gardenGrid.appendChild(plot);
      });
    }

    // Initialize
    updateStats();
    selectTier(25);
  </script>
</body>
</html>
